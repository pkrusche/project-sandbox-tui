[project]
name = "project-sandbox-tui"
version = "0.1.0"
description = "Minimal vim/ranger-style TUI for running project-sandbox sessions per branch"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Peter Krusche" }]
keywords = ["jj", "jujutsu", "sandbox", "coding-agent", "tui", "textual"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console :: Curses",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Version Control",
]
# Upper bounds: `uv tool install` does not use uv.lock, so a new major release
# must not reach users before it has been tested here.
dependencies = [
    "textual>=6.0,<9",  # TextArea.suggestion (prompt history completion)
    "tomlkit>=0.13,<0.16",  # sbx-tui config set/unset: edit TOML, keeping comments
]

[project.urls]
Homepage = "https://github.com/pkrusche/project-sandbox-tui"
Documentation = "https://github.com/pkrusche/project-sandbox-tui/tree/main/docs"
Issues = "https://github.com/pkrusche/project-sandbox-tui/issues"
Source = "https://github.com/pkrusche/project-sandbox-tui"

# project-sandbox itself is a separate tool: `uv tool install project-sandbox`,
# or point `sandbox.command` at e.g. "uvx project-sandbox".

[project.scripts]
sbx-tui = "project_sandbox_tui.cli:main"

[dependency-groups]
# Exact linter versions: new releases add rules and change formatting.
dev = [
    "pytest>=9.1,<10",
    "pytest-xdist>=3.8,<4",  # parallel runs: uv run pytest -n auto
    "ruff==0.17.1",
    "ty==0.0.90",
]

[build-system]
requires = ["hatchling>=1.27,<2"]  # 1.27: PEP 639 license / license-files
build-backend = "hatchling.build"

[tool.uv]
required-version = ">=0.11"  # keep in step with UV_VERSION in .github/workflows/ci.yml

[tool.hatch.build.targets.wheel]
packages = ["src/project_sandbox_tui"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
docstring-code-format = true

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.terminal]
error-on-warning = true
