[project]
name = "project-sandbox-tui"
version = "0.1.0"
description = "Minimal vim/ranger-style TUI for running project-sandbox sessions per branch"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Peter Krusche" }]
dependencies = [
    "textual>=6.0",  # TextArea.suggestion (prompt history completion)
    "tomlkit>=0.13",  # sbx-tui config set/unset: edit TOML, keeping comments
]

# project-sandbox itself is a separate tool: `uv tool install project-sandbox`,
# or point `sandbox.command` at e.g. "uvx project-sandbox".

[project.scripts]
sbx-tui = "project_sandbox_tui.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17",
    "ty>=0.0.90",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/project_sandbox_tui"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
docstring-code-format = true

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.terminal]
error-on-warning = true
