# project-sandbox-tui — per-project settings (merged over ~/.config/project-sandbox-tui/config.toml)
[project]
build = "python-uv"                  # python-uv | rust-cargo | node-npm
build_version = "3.12"
keep_workspace = true                  # -> --keep-workspace
default_branch_start = "main"        # start revision for new branches

[actions.review]
prompt = '''
Review {bookmark} against {main}. Follow AGENTS.md and docs/development.md.
Look for correctness bugs, regressions, and missing test coverage in the branch's
changes. Report actionable findings with file and line references, ordered by
severity, and note any remaining validation gaps. Do not modify files.
'''
persona = "reviewer"

[actions.check]
prompt = '''
Run the tests and development checks for {bookmark}, following AGENTS.md and
docs/development.md. Run uv sync --locked, scripts/test.sh, uv run ruff check .,
uv run ruff format --check ., uv run ty check, and uv build. Report the result
of each command and summarize failures or missing prerequisites. Do not modify
source files or update dependencies.
'''
persona = "checker"
level = 2

[actions.e2e]
prompt = '''
Run the real-container end-to-end smoke test for {bookmark}, following AGENTS.md
and the real container smoke test section of docs/development.md. Check that
project-sandbox, jj, and a supported container runtime are available, then run:
scripts/test.sh -n 0 -v -s tests/test_container_smoke.py --container-smoke --container-runtime auto
Follow the documented temporary-directory isolation rules. Report the outcome
and any failure log paths; if prerequisites are unavailable, report the blocker
without claiming the test passed. Do not modify source files.
'''
persona = "checker"
timeout = 3600
level = 2

[workflows.pre-release]
planning_action = "release-docs"
first_step_interactive = false
steps = ["check", "human-review", "host:smoke"]

[actions.release-docs]
prompt = """
Review README, docs/ and CHANGELOG.md against changes since the last release tag.
Report documentation gaps and do not modify files.
"""
persona = "reviewer"

[commands]
test = "scripts/test.sh"
smoke = "scripts/e2e-test.sh"

[leader]
t = "test"
T = "*test"
rv = "review"
rc = "check"
re = "e2e"

[profiles.chores]
agent = "codex"
model = "gpt-6-luna"
effort = "high"
fast = true

[profiles.planning]
agent = "codex"
model = "gpt-6.2-sol"
effort = "medium"
fast = false

[profiles.debugging]
agent = "codex"
model = "gpt-6.2-astra"
effort = "xhigh"
fast = false

[profiles.quick-feature]
agent = "codex"
model = "gpt-6.2-sol"
effort = "medium"
fast = true

# Checking profiles: Pi through the agent gateway, one pinned model each.
# Pick them in the launch form or workflow picker; actions keep their personas.
[profiles.check-gemini-hydrogen]
agent = "pi"
gateway = true
model = "gemini-4-hydrogen"

[profiles.check-gemini-neon]
agent = "pi"
gateway = true
model = "gemini-4-neon"

[profiles.check-gemini-argon]
agent = "pi"
gateway = true
model = "gemini-4-argon"

[profiles.check-haiku]
agent = "pi"
gateway = true
model = "claude-haiku-5-5"
effort = "low"

# OpenSpec skills (generated by openspec 2.0.0, core profile), copied into each
# bookmark workspace. Refresh: see docs/development.md.
[[workspace_skills]]
source = "skills/openspec-apply-change"
targets = [".agents/skills/openspec-apply-change", ".claude/skills/openspec-apply-change"]

[[workspace_skills]]
source = "skills/openspec-archive-change"
targets = [".agents/skills/openspec-archive-change", ".claude/skills/openspec-archive-change"]

[[workspace_skills]]
source = "skills/openspec-explore"
targets = [".agents/skills/openspec-explore", ".claude/skills/openspec-explore"]

[[workspace_skills]]
source = "skills/openspec-propose"
targets = [".agents/skills/openspec-propose", ".claude/skills/openspec-propose"]

[[workspace_skills]]
source = "skills/openspec-sync-specs"
targets = [".agents/skills/openspec-sync-specs", ".claude/skills/openspec-sync-specs"]

[[workspace_skills]]
source = "skills/openspec-update-change"
targets = [".agents/skills/openspec-update-change", ".claude/skills/openspec-update-change"]

[catalogue]
providers = ["codex", "claude-code", "gateway-openai", "gateway-anthropic", "gateway-gemini"]
default_provider = "codex"

[security]
level = 3

[models]
pi = ["gemini-4-hydrogen", "gemini-4-neon", "gemini-4-argon", "claude-haiku-5-5"]
