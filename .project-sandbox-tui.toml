# project-sandbox-tui — per-project settings (merged over ~/.config/project-sandbox-tui/config.toml)
[project]
build = "python-uv"                  # python-uv | rust-cargo | node-npm
build_version = "3.12"
keep_workspace = true                  # -> --keep-workspace
default_branch_start = "main"        # start revision for new branches

[actions.review]
prompt = '''
Review {bookmark} against {main}. Follow AGENTS.md and docs/development.md.
Look for correctness bugs, regressions, and missing test coverage in the branch's
changes. Report actionable findings with file and line references, ordered by
severity, and note any remaining validation gaps. Do not modify files.
'''

[actions.check]
prompt = '''
Run the tests and development checks for {bookmark}, following AGENTS.md and
docs/development.md. Run uv sync --locked, scripts/test.sh, uv run ruff check .,
uv run ruff format --check ., uv run ty check, and uv build. Report the result
of each command and summarize failures or missing prerequisites. Do not modify
source files or update dependencies.
'''

[actions.e2e]
prompt = '''
Run the real-container end-to-end smoke test for {bookmark}, following AGENTS.md
and the real container smoke test section of docs/development.md. Check that
project-sandbox, jj, and a supported container runtime are available, then run:
scripts/test.sh -n 0 -v -s tests/test_container_smoke.py --container-smoke --container-runtime auto
Follow the documented temporary-directory isolation rules. Report the outcome
and any failure log paths; if prerequisites are unavailable, report the blocker
without claiming the test passed. Do not modify source files.
'''
timeout = 3600

[workflows.spec]
planning_action = "spec-plan"
first_step_interactive = true
steps = ["spec-check", "spec-implement", "spec-chores", "spec-commits"]
pass_state_keys = ["spec_path"]
result_state_keys = ["commits"]

[actions.spec-plan]
prompt = '''
Write a Markdown plan or an OpenSpec change on {bookmark}. Record the scope,
acceptance criteria, verification, and a checklist of tasks. Save it in the
checkout. Reuse any existing draft for this topic and incorporate decisions
already recorded there. In an interactive session, work with the user and get
their approval.
In a background run, draft from the supplied topic and the repository, and
report blocked with the decisions needed if essential information is missing.
Report success with state.spec_path set to the workspace-relative Markdown file
or OpenSpec change directory. Leave implementation for the next step.
'''

[actions.spec-check]
prompt = '''
Read previous_state.spec_path from the run feedback context. Check that the spec
is present and that its scope, tasks, acceptance criteria, and verification give
the implementer enough information to start. Report blocked with the exact
questions or decisions that remain if the spec is incomplete. Report success if
the spec is ready. Leave the spec and source as you found them.
'''

[actions.spec-implement]
prompt = '''
Read the spec at previous_state.spec_path in the run feedback context and follow
AGENTS.md. Work through the checklist, marking tasks as you finish them. Resume
from any work already on the bookmark. When a decision is needed, record the
completed work and report blocked with the question that needs an answer. Report
success once all implementation tasks and their targeted checks are complete.
'''

[actions.spec-chores]
prompt = '''
Read the spec at previous_state.spec_path in the run feedback context. Finish
related formatting, documentation, and cleanup. Follow AGENTS.md and
docs/development.md for the development checks, including scripts/test.sh.
Record the checks actually run and their results in the feedback report. Fix
in-scope failures, and report blocked if a prerequisite or decision is needed.
Report success once the required checks pass.
'''
timeout = 3600

[actions.spec-commits]
prompt = '''
Read the spec at previous_state.spec_path in the run feedback context. Use jj to
organize the changes on {bookmark} since its divergence from {main} into an
ordered series of reviewable commits aligned with the spec's tasks. Keep the
final file tree intact and keep all changes on the feature bookmark. Inspect
the final series and verify the final tree matches the tested tree. Reuse any
existing commits whose boundaries already match the spec.
Report state.commits as an array, oldest first, with one object per commit. Each
object has commit_id (full revision ID), subject, spec_tasks (array of task IDs
or titles), and summary (what changes in that commit). Report blocked if the
scope or boundaries of the commit series need a decision.
'''

[commands]
test = "scripts/test.sh"
smoke = "scripts/e2e-test.sh"

[leader]
t = "test"
T = "*test"
rv = "review"
rc = "check"
re = "e2e"

[profiles.codex-high-fast]
agent = "codex"
model = "gpt-6-astra"
effort = "high"
fast = true
extra_args = []

[profiles.codex-sol-fast]
agent = "codex"
model = "gpt-6.1-sol"
effort = "high"
fast = true
extra_args = []

[profiles.codex-luna-fast]
agent = "codex"
model = "gpt-6-luna"
effort = "high"
fast = true
extra_args = []

[profiles.chores]
agent = "codex"
model = "gpt-6-luna"
effort = "high"
fast = true

[profiles.planning]
agent = "codex"
model = "gpt-6.2-sol"
effort = "medium"
fast = false

[profiles.debugging]
agent = "codex"
model = "gpt-6.2-astra"
effort = "xhigh"
fast = false

[profiles.quick-feature]
agent = "codex"
model = "gpt-6.2-sol"
effort = "medium"
fast = true
