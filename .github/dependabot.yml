# Proposes updates for the pinned versions: action SHAs in .github/workflows and
# uv.lock. jj (JJ_VERSION / JJ_SHA256 in ci.yml) is updated by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    groups:
      dev-tools:
        dependency-type: development
