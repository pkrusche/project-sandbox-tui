name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      container_smoke:
        description: Run the real Docker bash-agent smoke test (downloads and builds an image)
        type: boolean
        default: false

permissions:
  contents: read

env:
  UV_VERSION: "0.13.5"  # keep in step with [tool.uv] required-version in pyproject.toml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff + ty
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked
      - name: ruff lint
        run: uv run ruff check --output-format=github .
      - name: ruff format
        run: uv run ruff format --check --diff .
      - name: ty
        run: uv run ty check --output-format=github

  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is supported but not tested in CI yet: macos-latest
        os: [ubuntu-latest]
        python: ["3.12", "3.14"]  # oldest supported and newest
    env:
      JJ_VERSION: v0.46.0
      # sha256 of jj-${JJ_VERSION}-x86_64-unknown-linux-musl.tar.gz; update together
      JJ_SHA256: fce0271158e665ceb82dc66c5eb95b1728649094e9133074f3b5baece345fc08
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install jj (Linux)
        if: runner.os == 'Linux'
        run: |
          archive="$RUNNER_TEMP/jj.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/jj-vcs/jj/releases/download/${JJ_VERSION}/jj-${JJ_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${JJ_SHA256}  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" ./jj
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Install jj (macOS)
        if: runner.os == 'macOS'
        run: brew install jj
      - name: Install (locked)
        run: uv sync --locked
      - name: pytest
        run: scripts/test.sh -q
      - name: Install project-sandbox for container smoke
        if: github.event_name == 'workflow_dispatch' && inputs.container_smoke && matrix.python == '3.12'
        run: uv tool install project-sandbox==0.2.2
      - name: Real Docker bash-agent smoke
        if: github.event_name == 'workflow_dispatch' && inputs.container_smoke && matrix.python == '3.12'
        timeout-minutes: 30
        run: |
          scripts/test.sh -n 0 -v -s tests/test_container_smoke.py \
            --container-smoke --container-runtime docker \
            --basetemp "$RUNNER_TEMP/sbx-container-smoke"

  package:
    name: Build and install release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
      - name: Build sdist and wheel
        run: uv build
      - name: Install wheel in a clean environment
        run: |
          release_env="$RUNNER_TEMP/sbx-release"
          uv venv "$release_env"
          uv pip install --python "$release_env/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          "$release_env/bin/sbx-tui" --version
          "$release_env/bin/sbx-tui" --help
          "$release_env/bin/python" -I -c 'import project_sandbox_tui.app'
