name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff + ty
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked
      - name: ruff lint
        run: uv run ruff check --output-format=github .
      - name: ruff format
        run: uv run ruff format --check --diff .
      - name: ty
        run: uv run ty check --output-format=github

  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # os: [ubuntu-latest, macos-latest]
        # python: ["3.12", "3.14"]
        os: [ubuntu-latest]
        python: ["3.14"]
    env:
      JJ_VERSION: v0.46.0
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install jj (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL "https://github.com/jj-vcs/jj/releases/download/${JJ_VERSION}/jj-${JJ_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" ./jj
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Install jj (macOS)
        if: runner.os == 'macOS'
        run: brew install jj
      - name: Install (locked)
        run: uv sync --locked
      - name: pytest
        run: uv run pytest -q
